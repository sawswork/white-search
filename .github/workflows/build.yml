# 署名なしでコンパイルだけ確かめる。手動実行のみ（macランナーの無料枠を節約するため）。
name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Xcode を選ぶ
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: XcodeGen でプロジェクトを作る
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          xcodegen generate

      - name: ビルド（署名なし）
        run: |
          xcodebuild build \
            -project WhiteSearch.xcodeproj \
            -scheme WhiteSearch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: できあがった Info.plist を確かめる
        run: |
          APP=build/Build/Products/Release-iphoneos/WhiteSearch.app
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleDisplayName|CFBundleIdentifier|MinimumOSVersion|CFBundleVersion|ITSApp|UsageDescription'
          ls "$APP" | head -30
